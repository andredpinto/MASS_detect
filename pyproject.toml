[project]
name = "mass-detect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pylidc>=0.2.3",
    "pyradiomics",
    "scikit-learn>=1.7.2",
]

[project.scripts]
mass-detect = "mass_detect:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics" }
