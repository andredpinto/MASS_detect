# =============================================================================
# PyRadiomics parameter file for the mass_detect project
# =============================================================================
# Every choice below is a deliberate, documented decision. The reference for all
# definitions is the Image Biomarker Standardization Initiative (IBSI):
#   Zwanenburg A. et al. (2020), "The Image Biomarker Standardization Initiative",
#   Radiology 295(2):328-338.
# and the PyRadiomics documentation (van Griethuysen et al. 2017).
#
# Parameter categories (see www.yaml.org for the syntax):
#   setting:    preprocessing / class-level settings
#   imageType:  image types to calculate features on (Original + filters)
#   featureClass: which feature classes to enable (empty list = all features)
#
# WHY RESAMPLE TO 1 mm ISOTROPIC (change from the previous file, which disabled
# resampling): the LIDC nodule volumes in data/processed are anisotropic (in-plane
# pixel spacing 0.4-0.9 mm, slice thickness up to several mm), while the LNDb
# cubes cut by prepare_lndb_nodules.py are already 1 mm isotropic. Texture
# features (GLCM/GLRLM/GLSZM/GLDM/NGTDM) depend on voxel size:
#   Shafiq-ul-Hassan M. et al. (2017), Medical Physics 44(3):1050-1062,
# and the IBSI recommends isotropic voxels before computing features so that one
# feature value means the same thing in every scan. Resampling here (instead of
# in a separate step) keeps the whole extraction in one place. For the LNDb cubes
# this setting is a no-op (they are already 1 mm).
#
# WHY sitkLinear (change from sitkBSpline): linear interpolation is the standard
# choice for CT radiomics resampling. BSpline is smoother but can overshoot
# (ringing) across sharp HU transitions such as nodule/air boundaries, which
# distorts the discretised intensities that all texture features are built on.
#
# WHY binWidth 25 (unchanged): with a fixed bin width, a bin always spans the
# same density range (25 HU), so a bin means the same thing in every scan. The
# IBSI recommends a fixed bin SIZE (not a fixed bin count) for calibrated units
# such as Hounsfield units. 25 HU is the PyRadiomics default and is widely used
# in CT radiomics.
#
# WHY LoG filters at sigma 1, 2 and 3 mm (added; the previous file used only the
# original image): a Laplacian-of-Gaussian filter highlights blob-like structures
# and edges at a scale set by sigma. LNDb nodules are typically 3-15 mm, i.e.
# radii of roughly 1.5-7.5 mm, so sigmas of 1-3 mm probe exactly the scales at
# which nodules and their spiculation/lobulation appear. Multi-scale texture is
# standard practice in CT radiomics (e.g. the IBSI and LUNA16-related studies).
#
# WHY all feature classes including NGTDM (added; the previous file omitted NGTDM):
# NGTDM (coarseness, contrast, busyness, complexity, strength) captures
# differences between a voxel and its neighbourhood and is complementary to the
# GLCM/GLRLM/GLSZM/GLDM families. Redundancy between features is handled later,
# by the correlation filter in notebooks/01_radiomics_features_analysis.ipynb
# (not here: a parameter file is the wrong place to decide which features are
# redundant, because that depends on the data).
# =============================================================================

setting:
  # Intensity discretisation: fixed bin width of 25 HU (IBSI-recommended for
  # calibrated units such as HU).
  binWidth: 25
  # Label value of the nodule in the mask. Both the LIDC consensus masks
  # (lidc_preprocessing.py) and the LNDb masks (prepare_lndb_nodules.py) store
  # the nodule as label 1.
  label: 1
  # Interpolator used when resampling to the isotropic grid (see above).
  interpolator: 'sitkLinear'
  # Resample every volume to 1 mm isotropic voxels before computing features.
  # No-op for the already-isotropic LNDb cubes; makes the anisotropic LIDC
  # volumes comparable (see the comment block above).
  resampledPixelSpacing: [1, 1, 1]
  # Normalisation of the image intensities before discretisation. Left disabled
  # (None): HU are already calibrated across scanners, and normalisation would
  # destroy the absolute meaning of the bins (a "calcified nodule" signature is
  # exactly a high absolute HU).
  weightingNorm:
  # Minimum size (in voxels, after resampling) and minimum number of dimensions
  # an ROI must have for features to be computed. Below this, texture features
  # are dominated by interpolation artefacts. PyRadiomics' default is 1 voxel,
  # which is too permissive; 8 voxels (a 2x2x2 mm cube) is a conservative floor
  # for nodules of 3 mm or more.
  minimumROIDimensions: 1
  minimumROISize: 8
  # Tolerance for the geometry check between image and mask (default).
  geometryTolerance: 1e-3
  # All volumes are 3D. force2D would compute 2D features per slice.
  force2D: False

# Image types: the original image plus Laplacian-of-Gaussian filtered images at
# three scales (see the comment block above). PyRadiomics names them
# original, log-sigma-1-0-mm-3D, log-sigma-2-0-mm-3D, log-sigma-3-0-mm-3D.
imageType:
  Original: {}
  LoG:
    sigma: [1.0, 2.0, 3.0]

# Feature classes: every class is enabled. An empty list means "all features of
# this class" (PyRadiomics still excludes its own deprecated/redundant features
# unless they are listed explicitly).
featureClass:
  shape:        # shape features (2D/3D morphology); computed on the ROI mask
  firstorder:   # intensity statistics of the ROI voxels
  glcm:         # grey level co-occurrence matrix
  glrlm:        # grey level run length matrix
  glszm:        # grey level size zone matrix
  gldm:         # grey level dependence matrix
  ngtdm:        # neighbourhood grey tone difference matrix (added)
